{% load static %}{# Le logo déposé par l'agence, sinon celui livré pour elle, sinon son nom : jamais celui du logiciel. #}{% if agence.logo %}<img src="{% url 'logo_agence' %}" alt="{{ agence.designation }}" height="48">{% elif agence.logo_par_defaut %}<img src="{% static agence.logo_par_defaut %}" alt="{{ agence.designation }}" width="117" height="48">{% else %}<span class="nom-agence">{{ agence.designation }}</span>{% endif %}
