<div class="actions-fiche">
  {% if modifier %}<a class="bouton-petit secondaire" href="{{ modifier }}"><svg class="icone" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 3L8 19z"/><path d="M14.5 6.5l3 3"/></svg> Modifier</a>{% endif %}
