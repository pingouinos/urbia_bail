# Déploiement UrbiaBail : application, base PostgreSQL et conversion PDF.
# Sur le Synology : Container Manager > Projet > Créer, en pointant sur ce dossier.
services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://urbiabail:${POSTGRES_PASSWORD}@db:5432/urbiabail
      GOTENBERG_URL: http://gotenberg:3000
      DOCUMENTS_DIR: /documents
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Dossier partagé du NAS où sont rangés modèles et baux.
      - ${DOCUMENTS_HOST_DIR:-./documents}:/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbiabail
      POSTGRES_USER: urbiabail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${DB_HOST_DIR:-./donnees/postgres}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbiabail"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
