# Déploiement UrbiaBail sur un VPS : Caddy (HTTPS automatique), application,
# base PostgreSQL et conversion PDF. Seul Caddy est exposé sur Internet.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAINE: ${DOMAINE:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://urbiabail:${POSTGRES_PASSWORD}@db:5432/urbiabail
      GOTENBERG_URL: http://gotenberg:3000
      DOCUMENTS_DIR: /documents
    volumes:
      - documents:/documents
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante/')"]
      interval: 30s
      timeout: 5s
      retries: 3

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbiabail
      POSTGRES_USER: urbiabail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbiabail"]
      interval: 10s
      timeout: 5s
      retries: 5

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped

volumes:
  documents:
  postgres:
  caddy_data:
  caddy_config:
