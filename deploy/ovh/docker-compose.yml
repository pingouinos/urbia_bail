# Clefaria Loc · production sur une instance OVH Public Cloud (Ubuntu + Docker).
#
# L'instance ne construit rien : elle télécharge l'image publiée par GitHub à
# chaque fusion sur main. Seul Caddy est exposé sur Internet (ports 80 et 443)
# et obtient seul le certificat HTTPS ; la base et Gotenberg restent internes.
#
# Les données vivent dans le dossier du projet (/srv/clefaria, sur le volume
# Block Storage) : base dans postgres/, documents dans documents/, copies
# quotidiennes dans sauvegardes/. Recréer ou agrandir l'instance n'y touche pas.
#
# Réglages dans le fichier .env voisin (voir .env.example). Voir README.md.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  web:
    image: ghcr.io/pingouinos/clefaria-loc:main
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment: &environnement
      DATABASE_URL: postgres://urbiabail:${POSTGRES_PASSWORD}@db:5432/urbiabail
      GOTENBERG_URL: http://gotenberg:3000
      DOCUMENTS_DIR: /documents
      ALLOWED_HOSTS: ${DOMAINE}
      CSRF_TRUSTED_ORIGINS: https://${DOMAINE}
      HTTPS: "true"
      GUNICORN_WORKERS: "2"
    volumes:
      - ./documents:/documents
    mem_limit: 768m
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/sante/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1m

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: urbiabail
      POSTGRES_USER: urbiabail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    shm_size: 128m
    mem_limit: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urbiabail"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5m

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    mem_limit: 1536m

  sauvegarde:
    # Chaque nuit vers 2 h (heure de Paris) : copie de la base et des
    # documents dans sauvegardes/, gardée 14 jours. Ces copies restent sur le
    # volume : à recopier aussi hors de l'instance (README, « Sauvegardes »).
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          # Heure de Paris sans dépendre des fuseaux installés dans l'image.
          heure=$$(TZ=CET-1CEST,M3.5.0,M10.5.0/3 date +%H)
          sleep $$(( (26 - $${heure#0}) % 24 * 3600 + 60 ))
          jour=$$(date +%F)
          pg_dump -h db -U urbiabail --format=custom urbiabail > /sauvegardes/base-$$jour.dump \
            && tar czf /sauvegardes/documents-$$jour.tar.gz -C /documents . \
            && echo "Sauvegarde $$jour faite" || echo "Sauvegarde $$jour en échec" >&2
          find /sauvegardes -type f -mtime +14 -delete
          sleep 3600
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./sauvegardes:/sauvegardes
      - ./documents:/documents:ro
    mem_limit: 64m
    depends_on:
      db:
        condition: service_healthy

  purge:
    # Chaque jour : efface les candidatures arrivées à échéance (trois mois
    # après la décision, référentiel CNIL de la gestion locative).
    image: ghcr.io/pingouinos/clefaria-loc:main
    restart: unless-stopped
    env_file: .env
    environment: *environnement
    entrypoint: ["sh", "-c"]
    command:
      - |
        while true; do
          sleep 3600
          python manage.py purger_candidatures || echo "Purge des candidatures en échec" >&2
          sleep 82800
        done
    mem_limit: 256m
    depends_on:
      web:
        condition: service_healthy

configs:
  caddyfile:
    content: |
      ${DOMAINE} {
      	encode gzip
      	header {
      		X-Content-Type-Options nosniff
      		Referrer-Policy same-origin
      		-Server
      	}
      	reverse_proxy web:8000
      }

volumes:
  caddy_data:
  caddy_config:
