# Urbia Gestion · test sur le NAS Synology, accessible seulement depuis le réseau
# local en HTTP (http://<IP du NAS>:8080). La production reste le VPS
# (docker-compose.yml à la racine, avec Caddy et HTTPS).
#
# À coller dans Container Manager (Projet > Créer > Créer docker-compose.yml) :
# le NAS ne construit rien, il télécharge l'image publiée par GitHub à chaque
# fusion sur main. Mémoire de chaque conteneur bornée ; environ 160 Mo au repos,
# 310 Mo une fois le premier PDF produit.
#
# Les conteneurs utilisent directement le réseau du NAS (network_mode:
# host) : sur le DS220+, le réseau Docker interne laisse ouvrir une connexion
# entre conteneurs mais n'y fait passer aucune donnée. Seule l'application
# (port 8080) est visible du bureau ; la base (25432) et Gotenberg (23300)
# n'écoutent que sur le NAS lui-même.
#
# Avant de coller, remplacer :
#   - CHANGER-CETTE-CLE (une fois) par une cinquantaine de caractères aléatoires ;
#   - MOTDEPASSE (trois fois, à l'identique) par des lettres et des chiffres ;
#   - 192.168.1.10 (deux fois) par l'adresse IP du NAS.
services:
  web:
    image: ghcr.io/pingouinos/urbia_bail:main
    # Télécharge la dernière image publiée à chaque (re)création du projet.
    pull_policy: always
    restart: unless-stopped
    network_mode: host
    command: sh -c "python manage.py migrate --noinput && gunicorn config.wsgi --bind 0.0.0.0:8080 --workers 2 --access-logfile -"
    environment:
      SECRET_KEY: "CHANGER-CETTE-CLE"
      DATABASE_URL: "postgres://urbiabail:MOTDEPASSE@127.0.0.1:25432/urbiabail"
      ALLOWED_HOSTS: "192.168.1.10"
      CSRF_TRUSTED_ORIGINS: "http://192.168.1.10:8080"
      HTTPS: "false"
      MFA_OBLIGATOIRE: "true"
      DOCUMENTS_DIR: /documents
      GOTENBERG_URL: http://127.0.0.1:23300
    volumes:
      - documents:/documents
    mem_limit: 384m
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    # Port peu courant (le 5433 est déjà pris sur le DS220+), écoute
    # limitée au NAS lui-même, réglages réduits ; huge_pages=off évite un arrêt
    # brutal de la base sur certains noyaux Synology.
    command: postgres -c port=25432 -c listen_addresses=127.0.0.1 -c shared_buffers=64MB -c work_mem=4MB -c max_connections=20 -c huge_pages=off
    environment:
      POSTGRES_DB: urbiabail
      POSTGRES_USER: urbiabail
      POSTGRES_PASSWORD: "MOTDEPASSE"
    volumes:
      - postgres:/var/lib/postgresql/data
    shm_size: 128m
    healthcheck:
      # Par le réseau, pour n'être prête qu'une fois la vraie base démarrée.
      # Au tout premier démarrage, la base se crée avant d'écouter : les échecs
      # des 5 premières minutes ne comptent pas.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 25432 -U urbiabail"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5m

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    network_mode: host
    command: gotenberg --api-port=23300 --api-bind-ip=127.0.0.1
    mem_limit: 768m

  sauvegarde:
    # Chaque jour : copie de la base et des documents dans le dossier
    # sauvegardes/ du projet (visible dans File Station, à inclure dans Hyper
    # Backup), gardée 14 jours.
    image: postgres:16-alpine
    restart: unless-stopped
    network_mode: host
    entrypoint: ["sh", "-c"]
    command:
      - |
        # Première copie 10 minutes après le démarrage, une fois la base à jour.
        sleep 600
        while true; do
          jour=$$(date +%F)
          pg_dump -h 127.0.0.1 -p 25432 -U urbiabail --format=custom urbiabail > /sauvegardes/base-$$jour.dump \
            && tar czf /sauvegardes/documents-$$jour.tar.gz -C /documents . \
            && echo "Sauvegarde $$jour faite" || echo "Sauvegarde $$jour en échec" >&2
          find /sauvegardes -type f -mtime +14 -delete
          sleep 86400
        done
    environment:
      PGPASSWORD: "MOTDEPASSE"
    volumes:
      - ./sauvegardes:/sauvegardes
      - documents:/documents:ro
    mem_limit: 64m
    depends_on:
      db:
        condition: service_healthy

volumes:
  documents:
  postgres:
