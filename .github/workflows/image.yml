# Publie l'image de l'application sur le registre de GitHub à chaque fusion
# sur main. Le serveur de production la télécharge au lieu de la construire.
name: Image publiée

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VERSION=${{ github.sha }}
            DATE_VERSION=${{ github.event.head_commit.timestamp }}
          tags: |
            ghcr.io/pingouinos/clefaria-loc:main
            ghcr.io/pingouinos/clefaria-loc:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/pingouinos/clefaria-loc
