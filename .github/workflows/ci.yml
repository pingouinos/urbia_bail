name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urbiabail
          POSTGRES_USER: urbiabail
          POSTGRES_PASSWORD: urbiabail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U urbiabail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://urbiabail:urbiabail@localhost:5432/urbiabail
      SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t urbiabail:ci .
      - name: Démarrer la pile complète et interroger la sonde
        run: |
          printf 'SECRET_KEY=ci\nPOSTGRES_PASSWORD=ci\nALLOWED_HOSTS=localhost\n' > .env
          docker compose up -d --wait web
          docker compose exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/sante/').read().decode())"
      - name: Produire un mandat et un bail en PDF avec Gotenberg
        run: |
          docker compose up -d --wait gotenberg
          docker compose exec -T web python manage.py shell -v0 -c "
          import datetime as dt
          from decimal import Decimal
          from baux.models import Bail, Locataire
          from biens.models import Bailleur, Bien
          from documents.generation import convertir_pdf, generer_docx
          from mandats.models import Mandat
          bailleur = Bailleur.objects.create(civilite='M.', nom='Essai', prenom='Jean', adresse='1 rue de la Paix',
                                             code_postal='31000', ville='Toulouse')
          bien = Bien.objects.create(bailleur=bailleur, adresse='5 rue du Taur', code_postal='31000', ville='Toulouse',
                                     surface=Decimal('39'), nb_pieces=2, meuble=True, zone_tendue=True,
                                     type_habitat='collectif', regime_juridique='copropriete', classe_dpe='D',
                                     dernier_loyer=Decimal('700'), charges=Decimal('50'))
          mandat = Mandat.depuis_bien(bien)
          mandat.save()
          bail = Bail.depuis_bien(bien)
          bail.date_effet, bail.irl_trimestre, bail.irl_valeur = dt.date(2026, 11, 1), '2e trimestre 2026', Decimal('146.68')
          bail.save()
          Locataire.objects.create(bail=bail, civilite='Mme', nom='Martin', prenom='Julie')
          for nom, objet, modele in [('mandat', mandat, 'mandat_gestion.docx'), ('bail', bail, 'bail_habitation.docx')]:
              pdf = convertir_pdf(generer_docx(modele, objet.contexte_document()))
              assert pdf.startswith(b'%PDF'), pdf[:200]
              open(f'/tmp/{nom}.pdf', 'wb').write(pdf)
              print(nom, len(pdf), 'octets')
          "
          mkdir -p exemples
          docker compose cp web:/tmp/mandat.pdf exemples/mandat.pdf
          docker compose cp web:/tmp/bail.pdf exemples/bail.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: documents-exemple
          path: exemples/
      - if: failure()
        run: docker compose logs
