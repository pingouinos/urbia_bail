name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: urbiabail
          POSTGRES_USER: urbiabail
          POSTGRES_PASSWORD: urbiabail
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U urbiabail"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://urbiabail:urbiabail@localhost:5432/urbiabail
      SECRET_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Construire l'image Docker
        run: docker build -t urbiabail:ci .
      - name: Démarrer la pile complète et interroger la sonde
        run: |
          printf 'SECRET_KEY=ci\nPOSTGRES_PASSWORD=ci\nALLOWED_HOSTS=localhost\n' > .env
          docker compose up -d --wait web
          docker compose exec -T web python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/sante/').read().decode())"
      - name: Produire un mandat en PDF avec Gotenberg
        run: |
          docker compose up -d --wait gotenberg
          docker compose exec -T web python manage.py shell -v0 -c "
          from decimal import Decimal
          from documents.generation import convertir_pdf, generer_docx
          from mandats.models import Mandat
          mandat = Mandat(numero=1, mandant='Monsieur ESSAI Jean', mandant_adresse='1 rue de la Paix',
                          mandant_code_postal_ville='31000 Toulouse', designation='Appartement T2 de 39 m²',
                          adresse_bien='5 rue du Taur 31000 TOULOUSE', loyer_cc=Decimal('899'), charges=Decimal('45'))
          pdf = convertir_pdf(generer_docx('mandat_gestion.docx', mandat.contexte_document()))
          assert pdf.startswith(b'%PDF'), pdf[:200]
          open('/tmp/mandat.pdf', 'wb').write(pdf)
          print(len(pdf), 'octets')
          "
          docker compose cp web:/tmp/mandat.pdf mandat-exemple.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: mandat-exemple
          path: mandat-exemple.pdf
      - if: failure()
        run: docker compose logs
